
name: shopstream-airflow

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [shopstream]

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
      AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "180"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "14400"
      AIRFLOW__WORKERS__EXECUTION_API_TIMEOUT: "30"
      AIRFLOW__WORKERS__MAX_FAILED_HEARTBEATS: "6"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEB_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077?deploy-mode=client
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-shopstream-warehouse}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PYTHONPATH: /opt/spark-apps
    volumes: &airflow_volumes
      - airflow_logs:/opt/airflow/logs
      - ./dags:/opt/airflow/dags:ro
      - ../spark:/opt/spark-apps:ro
      - ../generators:/opt/shopstream/generators:ro
      - ../data:/opt/shopstream/data
      - shopstream_spark_data:/opt/spark-data
      - shopstream_spark_dependencies:/opt/spark/dependencies
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        if airflow users list --output json | python -c 'import json, sys; sys.exit(0 if any(row["username"] == sys.argv[1] for row in json.load(sys.stdin)) else 1)' "$${AIRFLOW_ADMIN_USER}"; then
          echo "ShopStream Airflow admin already exists."
        else
          airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname ShopStream --lastname Admin --role Admin --email admin@shopstream.local
        fi
    restart: "no"
    networks: [shopstream]

  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    group_add: ["185"]
    environment: *airflow_environment
    volumes: *airflow_volumes
    command: api-server
    ports:
      - "${AIRFLOW_UI_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [shopstream]

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: shopstream-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    group_add: ["185"]
    environment: *airflow_environment
    volumes: *airflow_volumes
    command:
      - bash
      - -c
      - |
        umask 0002
        exec airflow scheduler
    restart: unless-stopped
    networks: [shopstream]

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    group_add: ["185"]
    environment: *airflow_environment
    volumes: *airflow_volumes
    command: dag-processor
    restart: unless-stopped
    networks: [shopstream]

  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    group_add: ["185"]
    environment: *airflow_environment
    volumes: *airflow_volumes
    command: triggerer
    restart: unless-stopped
    networks: [shopstream]

volumes:
  airflow_db_data:
  airflow_logs:
  shopstream_spark_dependencies:
    external: true
    name: shopstream_spark_dependencies
  shopstream_spark_data:
    external: true
    name: shopstream_spark_data

networks:
  shopstream:
    external: true
    name: shopstream_default
