
services:

  # =====================================================
  # KAFKA
  # =====================================================

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    container_name: shopstream-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped


  # =====================================================
  # SPARK MASTER
  # =====================================================

  spark-master:
    image: apache/spark:3.5.9-python3
    container_name: shopstream-spark-master
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8081

    ports:
      - "7077:7077"
      - "8081:8081"

    volumes:
      - ./spark:/opt/spark-apps
      - ./checkpoints:/opt/spark-checkpoints
      - shopstream_spark_data:/opt/spark-data
      - spark_dependencies:/opt/spark/dependencies

    restart: unless-stopped


  # =====================================================
  # SPARK WORKER - PYTHON 3.11
  # =====================================================

  spark-worker:
    build:
      context: .
      dockerfile: spark/docker/Dockerfile
    image: shopstream-spark:3.5.9-python3.11
    container_name: shopstream-spark-worker
    hostname: spark-worker

    command:
      - bash
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-class \
          org.apache.spark.deploy.worker.Worker \
          spark://spark-master:7077

    depends_on:
      - spark-master

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_WEBUI_PORT: 8084
      PYSPARK_PYTHON: /usr/bin/python3.11

    ports:
      - "8084:8084"

    volumes:
      - ./spark:/opt/spark-apps
      - ./checkpoints:/opt/spark-checkpoints
      - shopstream_spark_data:/opt/spark-data
      - spark_dependencies:/opt/spark/dependencies

    restart: unless-stopped


# =====================================================
# PERSISTENT VOLUMES
# =====================================================

volumes:
  kafka_data:
  spark_dependencies:
  shopstream_spark_data:
    external: true
    name: shopstream_spark_data
